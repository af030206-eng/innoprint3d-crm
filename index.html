<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<title>InnoPrint3D CRM</title>
<style>
:root{--green:#0b5d3b;--green2:#16804b;--mint:#e8f7ee;--bg:#f4f7f5;--ink:#17231d;--muted:#718078;--line:#e1e9e4;--white:#fff;--orange:#f59e0b;--red:#dc5454;--shadow:0 8px 24px rgba(20,50,32,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;min-height:100vh}.topbar{background:var(--green);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:#ffffff20;display:grid;place-items:center;font-weight:900;font-size:19px;border:1px solid #ffffff40}.brand h1{font-size:17px;margin:0}.brand p{font-size:12px;margin:3px 0 0;color:#cce6d6}.top-actions{display:flex;gap:8px}.top-actions button{background:#ffffff18;border:1px solid #ffffff35;color:white;border-radius:10px;padding:9px 11px;font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 76px)}.sidebar{padding:18px 12px;border-right:1px solid var(--line);background:#fbfdfb}.nav{display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border:0;border-radius:11px;background:transparent;color:#526158}.nav button.active{background:var(--mint);color:var(--green);font-weight:700}.nav .ico{width:23px;text-align:center;font-size:17px}.side-note{margin:22px 8px;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted);line-height:1.5}.main{padding:24px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}.page-head h2{font-size:25px;margin:0 0 6px;letter-spacing:-.5px}.page-head p{margin:0;color:var(--muted);font-size:13px}.primary{background:var(--green);color:white;border:0;border-radius:11px;padding:11px 15px;font-weight:650}.secondary{background:white;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink)}.danger{color:var(--red);background:#fff4f4;border:1px solid #f4d7d7;border-radius:9px;padding:7px 10px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}.metric,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.metric-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:8px}.metric-icon{width:32px;height:32px;border-radius:10px;background:var(--mint);display:grid;place-items:center;font-size:16px}.metric-value{font-size:26px;font-weight:800;letter-spacing:-.7px;margin:13px 0 5px}.metric-sub{font-size:11px;color:var(--muted)}.dashboard-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.card h3{font-size:15px;margin:0 0 5px}.card .sub{color:var(--muted);font-size:12px;margin-bottom:15px}.chart{width:100%;height:220px;display:block}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.quick-list{display:grid;gap:9px}.quick-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:11px;background:#f8faf8}.dot{width:9px;height:9px;border-radius:50%;background:var(--green2);margin-top:5px;flex-shrink:0}.quick-item b{font-size:13px}.quick-item small{display:block;color:var(--muted);margin-top:3px;font-size:11px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{min-width:150px;flex:1}.field, input,select,textarea{background:white;border:1px solid #dce5df;border-radius:10px;padding:11px 12px;color:var(--ink);width:100%;outline:none}.field:focus,input:focus,select:focus,textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #16804b15}label{font-size:12px;color:#58665d;display:grid;gap:6px;font-weight:650}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:white}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #edf1ee;font-size:12px;vertical-align:middle}th{background:#f8faf8;color:var(--muted);font-weight:700}tr:last-child td{border-bottom:0}.person{font-weight:700;font-size:13px}.muted{color:var(--muted)}.pill{display:inline-flex;padding:5px 8px;border-radius:99px;background:#eef3ef;color:#58665d;font-size:10px;font-weight:700;white-space:nowrap}.pill.green{background:#e4f6ea;color:#08733d}.pill.yellow{background:#fff3d5;color:#916000}.pill.red{background:#ffe8e8;color:#b33232}.actions{display:flex;gap:5px;flex-wrap:wrap}.small-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:11px}.empty{text-align:center;padding:36px 15px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.kanban{display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:12px;overflow:auto}.kan-col{background:#edf2ee;border-radius:13px;padding:11px;min-height:180px}.kan-col h3{font-size:12px;margin:3px 2px 10px;display:flex;justify-content:space-between}.kan-card{background:white;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:8px}.kan-card b{font-size:13px}.kan-card p{font-size:11px;color:var(--muted);margin:5px 0 9px}.kan-card select{font-size:11px;padding:7px}.modal-back{position:fixed;inset:0;background:#0b2118a6;display:none;align-items:flex-end;justify-content:center;padding:15px;z-index:10}.modal-back.show{display:flex}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.close{border:0;background:#edf3ef;border-radius:9px;padding:8px 11px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#15271d;color:#fff;border-radius:12px;padding:12px 16px;z-index:30;box-shadow:var(--shadow);display:none;max-width:90vw;font-size:13px}.toast.show{display:block}.footer-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px}.mobile-nav{display:none}.template-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.template-card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}.template-card h3{font-size:14px;margin:0 0 8px}.template-card p{font-size:12px;line-height:1.55;color:#59685f;white-space:pre-wrap}.tag{font-size:10px;color:var(--green);background:var(--mint);border-radius:6px;padding:4px 6px;display:inline-block;margin-bottom:9px}
@media(max-width:800px){.layout{display:block}.sidebar{display:none}.main{padding:17px 13px 92px}.topbar{padding-left:14px;padding-right:14px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:13px}.metric-value{font-size:23px}.dashboard-grid,.split{grid-template-columns:1fr}.page-head h2{font-size:22px}.page-head{align-items:center}.page-head .primary{padding:10px 11px;font-size:12px}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;padding:7px 4px calc(7px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center;padding:5px 0}.mobile-nav button span{font-size:18px}.mobile-nav button.active{color:var(--green);font-weight:800}.top-actions button{padding:8px;font-size:11px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.modal-back{padding:0;align-items:flex-end}.modal{border-radius:18px 18px 0 0;max-height:94vh;padding:17px}.template-grid{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(3,220px)}.chart{height:190px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">IP</div><div><h1>InnoPrint3D CRM</h1><p>Клиенты · заказы · рост</p></div></div>
  <div class="top-actions"><button id="exportBtn">Экспорт данных</button><button id="importBtn">Импорт</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
</header>
<div class="layout">
<aside class="sidebar"><nav class="nav" id="sideNav">
<button class="active" data-page="dashboard"><span class="ico">▦</span>Обзор</button>
<button data-page="clients"><span class="ico">♙</span>Клиенты</button>
<button data-page="pipeline"><span class="ico">◫</span>Воронка продаж</button>
<button data-page="orders"><span class="ico">▣</span>Заказы</button>
<button data-page="tasks"><span class="ico">◷</span>Напоминания</button>
<button data-page="templates"><span class="ico">✉</span>Шаблоны сообщений</button>
</nav><div class="side-note"><b>Совет дня</b><br>Лучше написать 5 компаниям персонально и записать результат, чем отправить десятки одинаковых сообщений.</div></aside>
<main class="main" id="main"></main>
</div>
<nav class="mobile-nav" id="mobileNav">
<button class="active" data-page="dashboard"><span>▦</span>Обзор</button><button data-page="clients"><span>♙</span>Клиенты</button><button data-page="pipeline"><span>◫</span>Продажи</button><button data-page="orders"><span>▣</span>Заказы</button><button data-page="tasks"><span>◷</span>Задачи</button>
</nav>
</div>
<div class="modal-back" id="modalBack"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3 id="modalTitle">Добавить</h3><button class="close" id="closeModal">Закрыть ✕</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const STORE='innoprint3d_crm_v1';
const stages=[['new','Новый'],['contacted','Написали'],['replied','Ответил'],['discussion','Обсуждение'],['offer','Предложение'],['won','Заказ получен'],['lost','Отказ']];
const categories=['Магазин автотоваров','Установщик фаркопов','Автосервис','Кофейня / кафе','Ремонтная мастерская','Рекламное агентство','Игровой клуб','Производство','Другое'];
const templates=[
{title:'Магазин автотоваров',tag:'Колпачки на фаркоп',body:'Здравствуйте! Мы занимаемся изготовлением небольших изделий на 3D-принтере. Хотим предложить вашему магазину колпачки на фаркоп небольшими оптовыми партиями.\n\nМожем отправить фото, согласовать цену за штуку и начать с пробной партии. Подскажите, пожалуйста, кто у вас занимается закупками автоаксессуаров?'},
{title:'Установщик фаркопов / автосервис',tag:'Автоаксессуары',body:'Здравствуйте! Мы изготавливаем небольшие пластиковые аксессуары на заказ, в том числе колпачки на фаркоп. Хотел уточнить, бывают ли у вас запросы на такие изделия для клиентов?\n\nМогу прислать фото и условия для небольшой пробной партии.'},
{title:'Кофейня / кафе',tag:'QR-подставки',body:'Здравствуйте! Мы делаем аккуратные настольные подставки с QR-кодами для меню, Wi-Fi, отзывов или чаевых. Можно подобрать цвет и добавить название заведения.\n\nМогу отправить пример и рассчитать стоимость для одной точки или сети. Вам было бы интересно посмотреть варианты?'},
{title:'Мастерская / производство',tag:'Детали по запросу',body:'Здравствуйте! Мы выполняем небольшие заказы на 3D-печать: держатели, органайзеры, простые пластиковые детали и прототипы по готовой 3D-модели или согласованным размерам.\n\nПодскажите, бывают ли у вас детали или приспособления, которые трудно быстро купить готовыми? Можем обсудить конкретную задачу.'}
];
const blank=()=>({clients:[],orders:[],activities:[],tasks:[],createdAt:new Date().toISOString()});
let db=load();
function load(){try{let x=JSON.parse(localStorage.getItem(STORE));return x&&Array.isArray(x.clients)?x:blank()}catch(e){return blank()}}
function save(){localStorage.setItem(STORE,JSON.stringify(db));}
let page='dashboard';
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(n)||0);
const dateStr=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'}):'—';
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
function stageName(s){return stages.find(x=>x[0]===s)?.[1]||s}
function pill(s){let cls=['won','paid'].includes(s)?'green':['offer','discussion','replied'].includes(s)?'yellow':['lost','overdue'].includes(s)?'red':'';return `<span class="pill ${cls}">${esc(stageName(s)||s)}</span>`}
function clientName(c){return c.name||c.company||'Без названия'}
function activeClients(){return db.clients.filter(c=>c.stage!=='lost')}
function revenue(){return db.orders.filter(o=>o.status==='paid').reduce((a,o)=>a+Number(o.total||0),0)}
function profit(){return db.orders.filter(o=>o.status==='paid').reduce((a,o)=>a+Number(o.total||0)-Number(o.cost||0),0)}
function render(){
document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
const main=document.getElementById('main');
if(page==='dashboard')main.innerHTML=dashboard();
if(page==='clients')main.innerHTML=clientsPage();
if(page==='pipeline')main.innerHTML=pipelinePage();
if(page==='orders')main.innerHTML=ordersPage();
if(page==='tasks')main.innerHTML=tasksPage();
if(page==='templates')main.innerHTML=templatesPage();
drawCharts();
}
function head(title,sub,btn='',action=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub}</p></div>${btn?`<button class="primary" onclick="${action}">${btn}</button>`:''}</div>`}
function dashboard(){
let due=db.tasks.filter(t=>!t.done&&t.date<=today()).length;
let newM=db.clients.filter(c=>c.createdAt&&c.createdAt.slice(0,7)===today().slice(0,7)).length;
let paid=db.orders.filter(o=>o.status==='paid').length;
return `${head('Обзор','Краткая картина по клиентам и заказам', '+ Добавить клиента',"openClient()")}
<div class="metrics">
<div class="metric"><div class="metric-top">Всего клиентов <span class="metric-icon">♙</span></div><div class="metric-value">${db.clients.length}</div><div class="metric-sub">+${newM} в этом месяце</div></div>
<div class="metric"><div class="metric-top">Активные сделки <span class="metric-icon">◫</span></div><div class="metric-value">${db.clients.filter(c=>!['won','lost'].includes(c.stage)).length}</div><div class="metric-sub">В работе сейчас</div></div>
<div class="metric"><div class="metric-top">Оплачено <span class="metric-icon">₽</span></div><div class="metric-value">${money(revenue())}</div><div class="metric-sub">${paid} оплаченных заказов</div></div>
<div class="metric"><div class="metric-top">Прибыль <span class="metric-icon">↗</span></div><div class="metric-value">${money(profit())}</div><div class="metric-sub">По отмеченным оплатам</div></div>
</div>
<div class="dashboard-grid"><section class="card"><h3>Активность по месяцам</h3><div class="sub">Новые клиенты и оплаченные заказы</div><canvas id="activityChart" class="chart"></canvas></section>
<section class="card"><h3>Воронка продаж</h3><div class="sub">Количество клиентов на каждом этапе</div><canvas id="funnelChart" class="chart"></canvas></section></div>
<div class="split"><section class="card"><h3>Что требует внимания</h3><div class="sub">Задачи на сегодня и просроченные</div><div class="quick-list">${due?db.tasks.filter(t=>!t.done&&t.date<=today()).slice(0,5).map(t=>`<div class="quick-item"><span class="dot" style="background:${t.date<today()?'#dc5454':'#f59e0b'}"></span><div><b>${esc(t.title)}</b><small>${dateStr(t.date)} · ${esc(t.clientName||'Без клиента')}</small></div></div>`).join(''):'<div class="empty"><b>Пока всё спокойно</b>Добавь напоминание, чтобы не забыть о следующем контакте.</div>'}</div><button class="secondary" style="margin-top:12px" onclick="go('tasks')">Все напоминания</button></section>
<section class="card"><h3>Последние клиенты</h3><div class="sub">Недавно добавленные контакты</div><div class="quick-list">${db.clients.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5).map(c=>`<div class="quick-item"><span class="dot"></span><div><b>${esc(clientName(c))}</b><small>${esc(c.category||'Без категории')} · ${esc(stageName(c.stage))}</small></div></div>`).join('')||'<div class="empty"><b>Клиентов пока нет</b>Добавь первый магазин или компанию.</div>'}</div><button class="secondary" style="margin-top:12px" onclick="go('clients')">Открыть базу клиентов</button></section></div>
<p class="footer-note">Данные сохраняются в локальном хранилище этого браузера на этом устройстве. Регулярно делай «Экспорт данных» для резервной копии. Облачная синхронизация пока не подключена.</p>`;
}
function clientsPage(){
return `${head('Клиенты','Сохраняй контакты и веди историю переговоров','+ Добавить клиента','openClient()')}
<div class="toolbar"><input id="clientSearch" placeholder="Поиск по названию, контакту..." oninput="filterClients()"><select id="clientStage" onchange="filterClients()"><option value="">Все этапы</option>${stages.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select><select id="clientCategory" onchange="filterClients()"><option value="">Все категории</option>${categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
<div id="clientsTable">${clientsTable(db.clients)}</div>`;
}
function clientsTable(list){
if(!list.length)return `<div class="card empty"><b>Клиентов пока нет</b>Добавь первую компанию, которой хочешь предложить 3D-печать.<br><button class="primary" style="margin-top:14px" onclick="openClient()">Добавить первого клиента</button></div>`;
return `<div class="table-wrap"><table><thead><tr><th>Клиент</th><th>Категория</th><th>Контакт</th><th>Этап</th><th>Следующий контакт</th><th>Действия</th></tr></thead><tbody>${list.map(c=>`<tr><td><div class="person">${esc(clientName(c))}</div><div class="muted">${esc(c.city||'')}</div></td><td>${esc(c.category||'—')}</td><td>${esc(c.contact||'—')}<div class="muted">${esc(c.channel||'')}</div></td><td>${pill(c.stage)}</td><td>${dateStr(c.nextDate)}</td><td><div class="actions"><button class="small-btn" onclick="openActivity('${c.id}')">История</button><button class="small-btn" onclick="openClient('${c.id}')">Изменить</button></div></td></tr>`).join('')}</tbody></table></div>`;
}
function filterClients(){let q=(document.getElementById('clientSearch')?.value||'').toLowerCase(),s=document.getElementById('clientStage')?.value||'',cat=document.getElementById('clientCategory')?.value||'';let list=db.clients.filter(c=>(!q||[c.name,c.company,c.contact,c.city,c.notes].join(' ').toLowerCase().includes(q))&&(!s||c.stage===s)&&(!cat||c.category===cat));document.getElementById('clientsTable').innerHTML=clientsTable(list)}
function pipelinePage(){
return `${head('Воронка продаж','Перемещай клиентов по этапам сделки','+ Добавить клиента','openClient()')}<div class="kanban">${stages.map(([key,label])=>{let list=db.clients.filter(c=>c.stage===key);return `<section class="kan-col"><h3>${label}<span>${list.length}</span></h3>${list.map(c=>`<div class="kan-card"><b>${esc(clientName(c))}</b><p>${esc(c.category||'')} · ${esc(c.contact||'')}</p><select aria-label="Изменить этап" onchange="moveClient('${c.id}',this.value)">${stages.map(s=>`<option value="${s[0]}" ${s[0]===c.stage?'selected':''}>${s[1]}</option>`).join('')}</select><div style="margin-top:8px"><button class="small-btn" onclick="openActivity('${c.id}')">Записать действие</button></div></div>`).join('')||'<div class="muted" style="font-size:11px;padding:10px 3px">Пока пусто</div>'}</section>`}).join('')}</div>`;
}
function ordersPage(){
return `${head('Заказы','Следи за количеством, сроками, себестоимостью и оплатой','+ Новый заказ','openOrder()')}
<div class="metrics"><div class="metric"><div class="metric-top">Всего заказов</div><div class="metric-value">${db.orders.length}</div></div><div class="metric"><div class="metric-top">Оплачено</div><div class="metric-value">${db.orders.filter(o=>o.status==='paid').length}</div></div><div class="metric"><div class="metric-top">Выручка</div><div class="metric-value">${money(revenue())}</div></div><div class="metric"><div class="metric-top">Прибыль</div><div class="metric-value">${money(profit())}</div></div></div>
${db.orders.length?`<div class="table-wrap"><table><thead><tr><th>Заказ</th><th>Клиент</th><th>Изделие</th><th>Кол-во</th><th>Сумма</th><th>Прибыль</th><th>Срок</th><th>Статус</th><th>Действия</th></tr></thead><tbody>${db.orders.map(o=>`<tr><td>${esc(o.number||'—')}</td><td>${esc(o.clientName||'—')}</td><td><div class="person">${esc(o.product)}</div></td><td>${Number(o.qty)||0}</td><td>${money(o.total)}</td><td>${money((Number(o.total)||0)-(Number(o.cost)||0))}</td><td>${dateStr(o.due)}</td><td>${pill(o.status==='paid'?'paid':o.status==='done'?'won':o.status==='cancelled'?'lost':'discussion')}</td><td><div class="actions"><button class="small-btn" onclick="openOrder('${o.id}')">Изменить</button><button class="small-btn" onclick="deleteOrder('${o.id}')">Удалить</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty"><b>Заказов пока нет</b>Создай первый заказ, когда клиент подтвердит изделие и количество.</div>'}
<p class="footer-note">Прибыль здесь рассчитывается как сумма заказа минус указанная тобой себестоимость. Указывай реальные расходы, чтобы не переоценивать результат.</p>`;
}
function tasksPage(){
let list=db.tasks.slice().sort((a,b)=>(a.done-b.done)||(a.date||'').localeCompare(b.date||''));
return `${head('Напоминания','Планируй повторные сообщения и следующие действия','+ Напоминание','openTask()')}<div class="toolbar"><select id="taskFilter" onchange="filterTasks()"><option value="open">Активные</option><option value="all">Все</option><option value="done">Выполненные</option></select></div><div id="taskList">${tasksList(list.filter(t=>!t.done))}</div><p class="footer-note">Это внутренние напоминания в программе. Чтобы они приходили уведомлением на iPhone, нужно отдельно добавить поддержку уведомлений и разрешить их в браузере.</p>`;
}
function tasksList(list){if(!list.length)return '<div class="card empty"><b>Задач нет</b>Добавь напоминание связаться с клиентом.</div>';return `<div class="card" style="padding:0;overflow:hidden">${list.map(t=>`<div style="display:flex;gap:12px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--line)"><input type="checkbox" style="width:19px;margin-top:3px" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div style="flex:1"><b style="${t.done?'text-decoration:line-through;color:#87938b':''}">${esc(t.title)}</b><div class="muted" style="font-size:12px;margin-top:5px">${dateStr(t.date)} · ${esc(t.clientName||'Без клиента')}${t.note?' · '+esc(t.note):''}</div></div><button class="small-btn" onclick="deleteTask('${t.id}')">Удалить</button></div>`).join('')}</div>`}
function filterTasks(){let f=document.getElementById('taskFilter').value;document.getElementById('taskList').innerHTML=tasksList(db.tasks.filter(t=>f==='all'||(f==='done'?t.done:!t.done)))}
function templatesPage(){return `${head('Шаблоны сообщений','Скопируй текст и адаптируй его под конкретную компанию')}<div class="template-grid">${templates.map((t,i)=>`<article class="template-card"><span class="tag">${esc(t.tag)}</span><h3>${esc(t.title)}</h3><p id="tpl${i}">${esc(t.body)}</p><button class="primary" onclick="copyTemplate(${i})">Скопировать текст</button></article>`).join('')}</div><p class="footer-note">Не отправляй один и тот же текст массово. Добавляй имя компании и короткую причину, почему предложение может быть ей полезно.</p>`}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function openClient(cid=''){
let c=db.clients.find(x=>x.id===cid)||{id:'',name:'',company:'',category:categories[0],contact:'',channel:'Яндекс Карты / 2ГИС',city:'',stage:'new',nextDate:'',notes:''};
openModal(cid?'Изменить клиента':'Новый клиент',`<form id="clientForm" onsubmit="saveClient(event)"><input type="hidden" name="id" value="${esc(c.id)}"><div class="form-grid">
<label>Название компании / клиента *<input name="name" required value="${esc(c.name||c.company)}" placeholder="Например, АвтоПлюс"></label>
<label>Категория<select name="category">${categories.map(x=>`<option ${x===c.category?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
<label>Контактные данные<input name="contact" value="${esc(c.contact)}" placeholder="Телефон, Telegram, email"></label>
<label>Город<input name="city" value="${esc(c.city)}" placeholder="Город"></label>
<label>Откуда найден клиент<select name="channel">${['Яндекс Карты / 2ГИС','Авито','VK','Telegram','Сайт компании','Знакомые','Другое'].map(x=>`<option ${x===c.channel?'selected':''}>${x}</option>`).join('')}</select></label>
<label>Этап продажи<select name="stage">${stages.map(s=>`<option value="${s[0]}" ${s[0]===c.stage?'selected':''}>${s[1]}</option>`).join('')}</select></label>
<label>Следующий контакт<input type="date" name="nextDate" value="${esc(c.nextDate)}"></label>
<label class="full">Заметки<textarea name="notes" rows="3" placeholder="Что предложить, что ответили, особенности...">${esc(c.notes)}</textarea></label>
</div><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Отмена</button><button class="primary" type="submit">Сохранить клиента</button></div></form>`);
}
function saveClient(e){e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries());let old=db.clients.find(c=>c.id===v.id);v.id=v.id||id();v.createdAt=old?.createdAt||new Date().toISOString();v.history=old?.history||[];if(old)Object.assign(old,v);else{db.clients.push(v);db.activities.unshift({id:id(),clientId:v.id,date:today(),type:'Создан клиент',text:'Клиент добавлен в базу'});}save();closeModal();render();toast('Клиент сохранён')}
function moveClient(cid,stage){let c=db.clients.find(x=>x.id===cid);if(!c)return;let prev=c.stage;c.stage=stage;c.history=c.history||[];c.history.unshift({date:today(),text:`Этап изменён: ${stageName(prev)} → ${stageName(stage)}`});db.activities.unshift({id:id(),clientId:cid,date:today(),type:'Изменение этапа',text:`${stageName(prev)} → ${stageName(stage)}`});save();render();toast('Этап обновлён')}
function openActivity(cid){let c=db.clients.find(x=>x.id===cid);if(!c)return;let hist=(c.history||[]).map(h=>`<div class="quick-item"><span class="dot"></span><div><b>${esc(h.text)}</b><small>${dateStr(h.date)}</small></div></div>`).join('');openModal('История: '+clientName(c),`<div class="quick-list" style="margin-bottom:17px">${hist||'<p class="muted">История пока пустая.</p>'}</div><form onsubmit="saveActivity(event,'${c.id}')"><div class="form-grid"><label>Что произошло?<select name="type"><option>Написал клиенту</option><option>Получен ответ</option><option>Звонок</option><option>Отправлено предложение</option><option>Обсуждение заказа</option><option>Другое</option></select></label><label>Следующий контакт<input name="nextDate" type="date" value="${today()}"></label><label class="full">Заметка<textarea name="text" rows="3" required placeholder="Кратко запиши результат разговора..."></textarea></label></div><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Закрыть</button><button class="primary">Сохранить действие</button></div></form>`);
}
function saveActivity(e,cid){e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries()),c=db.clients.find(x=>x.id===cid);if(!c)return;c.history=c.history||[];c.history.unshift({date:today(),text:v.type+': '+v.text});if(v.nextDate)c.nextDate=v.nextDate;db.activities.unshift({id:id(),clientId:cid,date:today(),type:v.type,text:v.text});if(v.type==='Получен ответ'&&c.stage==='contacted')c.stage='replied';if(v.type==='Отправлено предложение')c.stage='offer';save();closeModal();render();toast('История обновлена')}
function openOrder(oid=''){let o=db.orders.find(x=>x.id===oid)||{id:'',number:'',clientId:'',product:'Колпачки на фаркоп',qty:1,price:0,cost:0,due:'',status:'new',notes:''};let total=(Number(o.qty)||0)*(Number(o.price)||0);openModal(oid?'Изменить заказ':'Новый заказ',`<form onsubmit="saveOrder(event)"><input type="hidden" name="id" value="${esc(o.id)}"><div class="form-grid">
<label>Номер заказа<input name="number" value="${esc(o.number||'')}" placeholder="Например, IP-001"></label>
<label>Клиент<select name="clientId"><option value="">Не выбран</option>${db.clients.map(c=>`<option value="${c.id}" ${c.id===o.clientId?'selected':''}>${esc(clientName(c))}</option>`).join('')}</select></label>
<label class="full">Изделие *<input name="product" required value="${esc(o.product)}" placeholder="Что печатаем"></label>
<label>Количество, шт.<input name="qty" type="number" min="1" required value="${Number(o.qty)||1}"></label>
<label>Цена за штуку, ₽<input name="price" type="number" min="0" step="0.01" required value="${Number(o.price)||0}"></label>
<label>Себестоимость всего заказа, ₽<input name="cost" type="number" min="0" step="0.01" value="${Number(o.cost)||0}"></label>
<label>Срок готовности<input name="due" type="date" value="${esc(o.due)}"></label>
<label>Статус<select name="status">${[['new','Новый'],['production','В производстве'],['done','Готов'],['paid','Оплачен'],['cancelled','Отменён']].map(s=>`<option value="${s[0]}" ${s[0]===o.status?'selected':''}>${s[1]}</option>`).join('')}</select></label>
<label class="full">Заметки<textarea name="notes" rows="2">${esc(o.notes||'')}</textarea></label>
</div><p class="muted" style="font-size:12px">Сумма заказа рассчитывается как количество × цена за штуку. Прибыль = сумма − себестоимость.</p><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Отмена</button><button class="primary">Сохранить заказ</button></div></form>`)}
function saveOrder(e){e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries()),old=db.orders.find(o=>o.id===v.id);v.id=v.id||id();v.qty=Number(v.qty)||0;v.price=Number(v.price)||0;v.cost=Number(v.cost)||0;v.total=v.qty*v.price;let c=db.clients.find(c=>c.id===v.clientId);v.clientName=c?clientName(c):'';v.createdAt=old?.createdAt||new Date().toISOString();if(old)Object.assign(old,v);else db.orders.unshift(v);if(c&&v.status!=='cancelled')c.stage='won';save();closeModal();render();toast('Заказ сохранён')}
function deleteOrder(oid){if(!confirm('Удалить этот заказ?'))return;db.orders=db.orders.filter(o=>o.id!==oid);save();render();toast('Заказ удалён')}
function openTask(tid=''){let t=db.tasks.find(x=>x.id===tid)||{id:'',title:'Связаться с клиентом',clientId:'',date:today(),note:''};openModal(tid?'Изменить напоминание':'Новое напоминание',`<form onsubmit="saveTask(event)"><input type="hidden" name="id" value="${esc(t.id)}"><div class="form-grid"><label class="full">Что нужно сделать? *<input name="title" required value="${esc(t.title)}"></label><label>Клиент<select name="clientId"><option value="">Без клиента</option>${db.clients.map(c=>`<option value="${c.id}" ${c.id===t.clientId?'selected':''}>${esc(clientName(c))}</option>`).join('')}</select></label><label>Дата<input type="date" name="date" required value="${esc(t.date)}"></label><label class="full">Комментарий<input name="note" value="${esc(t.note||'')}" placeholder="Что обсудить"></label></div><div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Отмена</button><button class="primary">Сохранить</button></div></form>`)}
function saveTask(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries()),old=db.tasks.find(t=>t.id===v.id),c=db.clients.find(c=>c.id===v.clientId);v.id=v.id||id();v.clientName=c?clientName(c):'';v.done=old?.done||false;if(old)Object.assign(old,v);else db.tasks.push(v);if(c&&v.date)c.nextDate=v.date;save();closeModal();render();toast('Напоминание сохранено')}
function toggleTask(tid,val){let t=db.tasks.find(x=>x.id===tid);if(t)t.done=val;save();render()}
function deleteTask(tid){db.tasks=db.tasks.filter(t=>t.id!==tid);save();render();toast('Напоминание удалено')}
function copyTemplate(i){let text=templates[i].body;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('Текст скопирован')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){let ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Текст скопирован')}catch(e){prompt('Скопируй текст вручную:',text)}ta.remove()}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('closeModal').onclick=closeModal;
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='innoprint3d-crm-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Резервная копия подготовлена')};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.clients)||!Array.isArray(x.orders))throw Error('bad');if(confirm('Импорт заменит текущие данные в этом браузере. Продолжить?')){db={...blank(),...x};save();render();toast('Данные импортированы')}}catch(err){alert('Не удалось импортировать файл. Выбери резервную копию InnoPrint3D CRM.')}e.target.value=''};
function drawCharts(){if(page!=='dashboard')return;drawActivity();drawFunnel()}
function setupCanvas(id){let c=document.getElementById(id);if(!c)return null;let r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);let ctx=c.getContext('2d');ctx.scale(dpr,dpr);return {c,ctx,w:r.width,h:r.height}}
function drawActivity(){let z=setupCanvas('activityChart');if(!z)return;let {ctx,w,h}=z;ctx.clearRect(0,0,w,h);let months=[];let now=new Date();for(let i=5;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1);let key=d.toISOString().slice(0,7);months.push({key,label:d.toLocaleDateString('ru-RU',{month:'short'}),clients:db.clients.filter(c=>(c.createdAt||'').slice(0,7)===key).length,orders:db.orders.filter(o=>(o.createdAt||'').slice(0,7)===key&&o.status==='paid').length})}let max=Math.max(3,...months.flatMap(m=>[m.clients,m.orders]));let left=24,bottom=h-27,top=14,chartH=bottom-top;ctx.font='10px -apple-system,Arial';for(let i=0;i<4;i++){let y=top+chartH*i/3;ctx.strokeStyle='#e8eee9';ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-8,y);ctx.stroke()}let group=(w-left-12)/months.length,bw=Math.min(16,group*.27);months.forEach((m,i)=>{let x=left+i*group+group*.25;let a=m.clients/max*chartH,b=m.orders/max*chartH;ctx.fillStyle='#16804b';ctx.fillRect(x,bottom-a,bw,a);ctx.fillStyle='#9bd8b0';ctx.fillRect(x+bw+4,bottom-b,bw,b);ctx.fillStyle='#758279';ctx.textAlign='center';ctx.fillText(m.label,x+group*.33,bottom+16)});ctx.textAlign='left';ctx.fillStyle='#16804b';ctx.fillRect(left,2,8,8);ctx.fillStyle='#718078';ctx.fillText('Клиенты',left+12,10);ctx.fillStyle='#9bd8b0';ctx.fillRect(left+72,2,8,8);ctx.fillStyle='#718078';ctx.fillText('Оплаты',left+84,10)}
function drawFunnel(){let z=setupCanvas('funnelChart');if(!z)return;let {ctx,w,h}=z;ctx.clearRect(0,0,w,h);let vals=stages.slice(0,6).map(s=>({name:s[1],n:db.clients.filter(c=>c.stage===s[0]).length}));let max=Math.max(1,...vals.map(v=>v.n));let left=90,right=35,top=10,row=(h-20)/vals.length;ctx.font='10px -apple-system,Arial';vals.forEach((v,i)=>{let y=top+i*row+row*.2,bh=Math.min(16,row*.55),bw=(w-left-right)*v.n/max;ctx.fillStyle='#6b927b';ctx.fillRect(left,y,bw,bh);ctx.fillStyle='#637168';ctx.textAlign='right';ctx.fillText(v.name,left-8,y+bh*.72);ctx.textAlign='left';ctx.fillStyle='#1c3024';ctx.fillText(String(v.n),Math.min(w-17,left+bw+5),y+bh*.72)});}
window.addEventListener('resize',()=>{if(page==='dashboard')drawCharts()});
render();
</script>
</body>
</html>
